[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "powerball"
version = "0.1.0"
description = "Powerball historical-draw analyzer and ticket picker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-dotenv>=1.0"]
dev = ["pytest>=8", "ruff>=0.6", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "python-dotenv>=1.0"]

[project.scripts]
powerball = "powerball.cli:main"
powerball-api = "powerball.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/powerball"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
